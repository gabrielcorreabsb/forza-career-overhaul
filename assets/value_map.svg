<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 594" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Where each value lives, and what we decided</title>
  <desc id="d">A map of the career values by level. Global, in the AI statics file of the install: the speed band of every AI driver narrowed (used), the off-track speed limit raised (used), a single track tuned through a new per-track file (discovered). AI roster document: a levelled field at the class ceiling and hand-picked models in a free document (used). Series: race switches with slow-down and catch-up on and two off (used), all four on as a beta choice (discovered), the cars the player may bring (used), the AI difficulty label and slot count (no effect), damage and tyre wear of the series (masked by the player preset). Event and override: roster document, PI cap, class and laps set explicitly (used); weather, forecast, race clock, start and practice (discovered). Server side: prizes of our own, car level and points (closed).</desc>
  <style>
    .bg{fill:#0B0E14}
    .card{fill:#11161F;stroke:#21262D;stroke-width:1}
    .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .s{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8B949E}
    .r{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .b{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .n{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#0B0E14}
    .p{font:700 11px "Segoe UI",Helvetica,Arial,sans-serif;fill:#0B0E14}
    .k{font:12px Consolas,"Courier New",monospace;fill:#58A6FF}
    .ln{stroke:#30363D;stroke-width:1.5;fill:none}
    .lk{stroke:#21262D;stroke-width:1}
  </style>
  <rect class="bg" width="620" height="594" rx="6"/>
<text class="h" x="24" y="30">Where each value lives, and what we decided</text>
<text class="s" x="24" y="48">Used = in our standard. Discovered = works, available. No effect and masked = leave as inherited.</text>
<rect x="24" y="58" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="52.0" y="71" text-anchor="middle">USED</text>
<rect x="88" y="58" width="92" height="18" rx="9" fill="#58A6FF"/><text class="p" x="134.0" y="71" text-anchor="middle">DISCOVERED</text>
<rect x="188" y="58" width="82" height="18" rx="9" fill="#8B949E"/><text class="p" x="229.0" y="71" text-anchor="middle">NO EFFECT</text>
<rect x="278" y="58" width="70" height="18" rx="9" fill="#D29922"/><text class="p" x="313.0" y="71" text-anchor="middle">MASKED</text>
<rect x="356" y="58" width="66" height="18" rx="9" fill="#F85149"/><text class="p" x="389.0" y="71" text-anchor="middle">CLOSED</text>
<text class="b" x="24" y="102">Global: the AI statics file of the install</text>
<line class="lk" x1="24" y1="108" x2="596" y2="108"/>
<text class="r" x="36" y="128">Speed band of every AI driver, narrowed</text>
<rect x="540" y="116" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="129" text-anchor="middle">USED</text>
<text class="r" x="36" y="152">Off-track speed limit of the AI, raised</text>
<rect x="540" y="140" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="153" text-anchor="middle">USED</text>
<text class="r" x="36" y="176">One track alone, through a new per-track file</text>
<rect x="504" y="164" width="92" height="18" rx="9" fill="#58A6FF"/><text class="p" x="550.0" y="177" text-anchor="middle">DISCOVERED</text>
<text class="b" x="24" y="208">AI roster document, one per class</text>
<line class="lk" x1="24" y1="214" x2="596" y2="214"/>
<text class="r" x="36" y="234">Levelled field at the class ceiling (S 800, A 700)</text>
<rect x="540" y="222" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="235" text-anchor="middle">USED</text>
<text class="r" x="36" y="258">Hand-picked models, 23 slots, a free document</text>
<rect x="540" y="246" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="259" text-anchor="middle">USED</text>
<text class="b" x="24" y="290">Series</text>
<line class="lk" x1="24" y1="296" x2="596" y2="296"/>
<text class="r" x="36" y="316">Race switches: slow-down and catch-up on, two off</text>
<rect x="540" y="304" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="317" text-anchor="middle">USED</text>
<text class="r" x="36" y="340">All four switches on (a choice for the beta)</text>
<rect x="504" y="328" width="92" height="18" rx="9" fill="#58A6FF"/><text class="p" x="550.0" y="341" text-anchor="middle">DISCOVERED</text>
<text class="r" x="36" y="364">Cars the player may bring</text>
<rect x="540" y="352" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="365" text-anchor="middle">USED</text>
<text class="r" x="36" y="388">AI difficulty label, AI slot count</text>
<rect x="514" y="376" width="82" height="18" rx="9" fill="#8B949E"/><text class="p" x="555.0" y="389" text-anchor="middle">NO EFFECT</text>
<text class="r" x="36" y="412">Damage and tyre wear of the series</text>
<rect x="526" y="400" width="70" height="18" rx="9" fill="#D29922"/><text class="p" x="561.0" y="413" text-anchor="middle">MASKED</text>
<text class="b" x="24" y="444">Event and its override</text>
<line class="lk" x1="24" y1="450" x2="596" y2="450"/>
<text class="r" x="36" y="470">Roster document, PI cap, class, laps (set explicitly)</text>
<rect x="540" y="458" width="56" height="18" rx="9" fill="#3FB950"/><text class="p" x="568.0" y="471" text-anchor="middle">USED</text>
<text class="r" x="36" y="494">Weather, forecast, race clock, start, practice</text>
<rect x="504" y="482" width="92" height="18" rx="9" fill="#58A6FF"/><text class="p" x="550.0" y="495" text-anchor="middle">DISCOVERED</text>
<text class="b" x="24" y="526">Server side</text>
<line class="lk" x1="24" y1="532" x2="596" y2="532"/>
<text class="r" x="36" y="552">Prizes of our own, car level and points</text>
<rect x="530" y="540" width="66" height="18" rx="9" fill="#F85149"/><text class="p" x="563.0" y="553" text-anchor="middle">CLOSED</text>
<text class="s" x="24" y="578">Evidence: DISCOVERIES (D72 to D80), SERIES_FIELD_VALUES. 16 Nov 2026.</text>
</svg>
