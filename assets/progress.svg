<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 798" width="100%" role="img" aria-labelledby="t d">
  <title id="t">What already works: the stages of the career mod and their status</title>
  <desc id="d">Twenty-eight stages of the career mod. Verified in game: own place in the career, spec races, trackday, honest multi-class AI, AI per class or make, own AI pools of a theme and series that serve the game's challenges, series with several events, progression gates, the AI standard (a narrow speed band and a levelled field), series and event fields tried across their range, the car list, points per position, practice clock and lock texts, and own series posters and intro videos. Observed: start type and slot, race weekend, weather and its timing, race clock, tyre wear and pit stop; per-track pit limit, rolling start and hood camera from the game database. In progress: the FCO Intro Series, built from a documented base profile next to the vanilla Builders Cup, a season built on the game's live challenges, and own tracks that pay behind a track id the server already pays. Planned: entry ladder, one-make and period series. To test: fuel and tyre compound; the client's feature flags. Closed: prizes of our own and a real qualifying; series fields that do not act; descriptions, a cup practice limit and a ladder label, which show nothing on screen; changing the career while the game is open, which the game blocks; the career AI and car prices through the game database, and pay on new track ids.</desc>
  <style>
    .bg{fill:#0B0E14}
    .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .s{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8B949E}
    .r{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .p{font:700 11px "Segoe UI",Helvetica,Arial,sans-serif;fill:#0B0E14}
  </style>
  <rect class="bg" width="620" height="798" rx="6"/>
