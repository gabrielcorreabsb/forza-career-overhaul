<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680" width="100%" role="img" aria-labelledby="t d">
  <title id="t">What already works: the stages of the career mod and their status</title>
  <desc id="d">Twenty-three stages of the career mod. Verified in game: own place in the career, spec races, trackday, honest multi-class AI, AI per class or make, own AI pools of a theme and series that serve the game's challenges, series with several events, progression gates, the AI standard (a narrow speed band and a levelled field), series and event fields tried across their range, and the car list ranges, points per position, practice clock and lock texts. Observed: start type and slot, race weekend, practice length, weather and its timing, race clock, tyre wear and pit stop. In progress: a first own season and a second one built on the game's live challenges. Planned: entry ladder, one-make and period series. To test: fuel and tyre compound; banners, intro videos and the client's feature flags. Closed: prizes of our own and a real qualifying; series fields that do not act (open class, slot counts, practice minutes); descriptions, a cup practice limit and a ladder label, which show nothing on screen.</desc>
  <style>
    .bg{fill:#0B0E14}
    .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .s{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8B949E}
    .r{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .p{font:700 11px "Segoe UI",Helvetica,Arial,sans-serif;fill:#0B0E14}
    .l{stroke:#21262D;stroke-width:1}
  </style>
  <rect class="bg" width="620" height="680" rx="6"/>
  <text class="h" x="24" y="30">What already works</text>
  <text class="s" x="24" y="48">11 verified in game, 3 observed, 2 in progress. Planned means not built yet.</text>

