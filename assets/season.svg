<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" role="img" aria-labelledby="t d">
  <title id="t">The first season of our own: one cup, three groups that unlock in order</title>
  <desc id="d">A cup of our own holds three groups of two series each; every series has two or three events. Group 1 is open, groups 2 and 3 stay locked until the group before is done. The AI is German only, one roster per class, inside the player's class.</desc>
  <style>
    .bg{fill:#0B0E14}
    .h{font:700 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .s{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8B949E}
    .r{font:13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}
    .b{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif}
    .box{fill:#161B22;stroke:#30363D;stroke-width:1}
  </style>
  <rect class="bg" width="620" height="250" rx="6"/>
  <text class="h" x="24" y="30">A first season of our own</text>
  <text class="s" x="24" y="48">One cup, three groups that unlock in order, six series of 2 to 3 events each. First group played.</text>

  <!-- cup -->
  <rect x="24" y="62" width="572" height="30" rx="6" fill="#161B22" stroke="#D29922" stroke-width="1.5"/>
  <text class="b" x="40" y="82" fill="#D29922">CUP OF OUR OWN</text>
  <text class="s" x="190" y="82">shows in the career; the Challenge Hub keeps opening</text>

  <!-- connectors -->
  <path d="M110 92 V108 M310 92 V108 M510 92 V108" stroke="#30363D" stroke-width="2" fill="none"/>

  <!-- group 1 -->
  <rect class="box" x="24" y="108" width="172" height="104" rx="6"/>
  <text class="b" x="38" y="130" fill="#3FB950">GROUP 1 · OPEN</text>
  <rect x="38" y="142" width="144" height="26" rx="4" fill="#0B0E14" stroke="#3FB950"/><text class="r" x="48" y="160">series A · 2-3 events</text>
  <rect x="38" y="174" width="144" height="26" rx="4" fill="#0B0E14" stroke="#3FB950"/><text class="r" x="48" y="192">series B · 2-3 events</text>

  <!-- group 2 -->
  <rect class="box" x="224" y="108" width="172" height="104" rx="6"/>
  <text class="b" x="238" y="130" fill="#8B949E">GROUP 2 · LOCKED</text>
  <rect x="238" y="142" width="144" height="26" rx="4" fill="#0B0E14" stroke="#30363D" stroke-dasharray="4 3"/><text class="r" x="248" y="160" fill="#8B949E">series C</text>
  <rect x="238" y="174" width="144" height="26" rx="4" fill="#0B0E14" stroke="#30363D" stroke-dasharray="4 3"/><text class="r" x="248" y="192" fill="#8B949E">series D</text>

  <!-- group 3 -->
  <rect class="box" x="424" y="108" width="172" height="104" rx="6"/>
  <text class="b" x="438" y="130" fill="#8B949E">GROUP 3 · LOCKED</text>
  <rect x="438" y="142" width="144" height="26" rx="4" fill="#0B0E14" stroke="#30363D" stroke-dasharray="4 3"/><text class="r" x="448" y="160" fill="#8B949E">series E</text>
  <rect x="438" y="174" width="144" height="26" rx="4" fill="#0B0E14" stroke="#30363D" stroke-dasharray="4 3"/><text class="r" x="448" y="192" fill="#8B949E">series F</text>

  <!-- arrows between groups -->
  <path d="M196 160 H224 M396 160 H424" stroke="#D29922" stroke-width="2" fill="none"/>
  <path d="M218 155 L224 160 L218 165 M418 155 L424 160 L418 165" stroke="#D29922" stroke-width="2" fill="none"/>

  <text class="s" x="24" y="236">The AI is German only, one roster per class, inside your class. A group opens when the one before is done.</text>
</svg>
